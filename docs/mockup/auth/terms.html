<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>약관 전문 · WHALE ERP</title>
    <link rel="icon" href="../assets/img/favicon.svg" />
    <link rel="stylesheet" href="../assets/whale.css" />
  </head>
  <body data-root="../" data-page="auth" data-sub="auth/terms.html">
    <!-- 약관 전문 · /terms · 약관 콘텐츠(F-OFBCVL)
         로그인 전 누구나 여는 전문 화면이다. 고른 탭은 주소 해시 하나로 둔다 — 해시는 약관 유형 코드(TERMS_TYPE)이고,
         모르는 값이면 첫 탭이다. 푸터의 이용약관은 #TERMS_SERVICE, 개인정보처리방침은 #PRIVACY_COLLECT 로 들어온다.
         결정 2026-10-19 재영 (PR #52): 푸터 약관 링크는 팝업이 아니라 이 화면으로 온다(2026-10-12 의 팝업 결정을 바꿈).
         개인정보처리방침은 따로 두지 않고 개인정보 수집·이용 동의(BP 사업자 회원가입용, PRIVACY_COLLECT)를 연다.
         목록·본문은 api 공개 조회(GET /public-terms-versions, /public-terms-versions/{termsTypeCode})로 받는다 — 원본은 DB terms_versions 다.
         auth.js 의 TERMS 는 api#66 이 DB 로 옮긴 문구의 사본이라, 목업을 고쳐도 실제 화면은 바뀌지 않는다.
         버전 줄은 「버전 · 시행일 날짜」다. 본문 하나를 받지 못하면 그 탭만 빼고 위에 안내 한 줄을 두며,
         목록을 못 받거나 비면 탭 없이 안내만 둔다 — 위 목업 상태 줄로 본다.
         실제 화면은 데모(docs/demo auth/terms.html)대로 왼쪽 세로 탭이다. 이 목업의 가로 탭은 배치만 다르다.
         받는 대상별로 묶어서 둔다 — 1)·2) BP 사업자 회원가입(BP 회원가입 화면), 3)·4)·5)·6) 직원 근무 앱 회원가입(아직 목업 없음).
         4) 직원 개인정보 수집·이용 동의는 2026-09-30 자체 초안(v0.1)을 처음 채웠다 — 3팀 목업(staff/overview.html 의 주민등록번호·급여계좌 결정)과
         타사 근태관리 SaaS(flex 등) 표준을 참고했고, 아직 3팀·법무 검토 전이라 [ ] 표시가 많다.
         지금 문구는 타사 비교 표준안 초안(docs/raw/2026-09-29-약관3종-표준안.md)이며 법무 검토 전이다. -->
    <a class="skip" href="#main">본문으로 건너뛰기</a>
    <div class="shell">
      <main class="main" id="main">
        <div class="titlebar">
          <h1 class="t-h1">약관 전문</h1>
          <span class="badge badge--warn">1팀 작업</span>
          <div class="titlebar__end">
            <span class="filters__count mono">F-OFBCVL · /terms</span>
          </div>
        </div>

        <div class="content">

          <div class="screen">
            <div class="screen__bar"><i></i><i></i><i></i><span>whale-erp.com/terms</span></div>
          <div class="auth auth--framed" style="grid-template-columns: 1fr">
            <div class="auth__form" style="max-width: 1120px; justify-content: flex-start">
              <div class="inline">
                <a class="brand" href="login.html">
                  <span class="wm brand__mark" data-icon="whale" data-icon-size="32"></span>
                  <span class="brand__name">WHALE <span>ERP</span></span>
                </a>
              </div>

              <div class="demo">
                <b>초안</b>
                <span>1)·2) 는 BP 사업자 회원가입에서, 3)·4)·5)·6) 은 직원 근무 앱 회원가입에서 받습니다. 법무 검토 전 초안이며 [ ] 는 회사가 채울 값입니다.</span>
              </div>

              <div class="demo" data-demo="tmbox">
                <b>목업 상태</b>
                <div class="seg">
                  <button type="button" data-state="base" aria-pressed="true">기본</button>
                  <button type="button" data-state="partial" aria-pressed="false">본문 일부 실패</button>
                  <button type="button" data-state="fail" aria-pressed="false">목록 실패 · 없음</button>
                </div>
              </div>

              <div id="tmbox" class="stack--lg" style="display: flex; flex-direction: column">
              <!-- 본문 하나를 받지 못하면(사용 중 버전 없음 등) 그 탭만 빼고 탭 위에 한 줄을 둔다. 목업은 6) 위치정보가 빠진 경우다. -->
              <div class="band band--warn" data-show="partial" hidden>
                <span class="band__ic" data-icon="alert" data-icon-size="20"></span>
                <div class="band__body">
                  <div class="band__title">일부 약관을 불러오지 못했습니다.</div>
                </div>
              </div>
              <div class="band band--risk" data-show="fail" hidden>
                <span class="band__ic" data-icon="alert" data-icon-size="20"></span>
                <div class="band__body">
                  <div class="band__title">약관을 불러오지 못했습니다. 잠시 뒤 다시 시도해 주세요.</div>
                </div>
              </div>

              <div class="stack--lg" data-show="base partial" style="display: flex; flex-direction: column">
              <div class="tabs" data-tabs="tm">
                <button data-tab="TERMS_SERVICE" aria-selected="true">1) 플랫폼 이용약관(BP사업자 회원가입용) <span class="count">가입</span></button>
                <button data-tab="PRIVACY_COLLECT" aria-selected="false">2) 개인정보 수집·이용 <span class="count">가입</span></button>
                <span aria-hidden="true" style="width: 1px; align-self: stretch; background: var(--hairline-strong); margin: 0 2px"></span>
                <button data-tab="STAFF_TERMS_SERVICE" aria-selected="false">3) 플랫폼 이용약관(직원앱 회원가입용) <span class="count">직원 앱</span></button>
                <button data-tab="STAFF_PRIVACY" aria-selected="false">4) 개인정보 수집·이용 <span class="count">직원 앱</span></button>
                <button data-tab="MARKETING" aria-selected="false">5) 마케팅 수신 <span class="count">직원 앱</span></button>
                <button data-tab="LOCATION" aria-selected="false" data-show="base">6) 위치정보 수집·이용 <span class="count">직원 앱</span></button>
              </div>

              <div id="tm">
                <div class="stack" data-panel="TERMS_SERVICE" data-terms-doc="TERMS_SERVICE"></div>
                <div class="stack" data-panel="PRIVACY_COLLECT" data-terms-doc="PRIVACY_COLLECT" hidden></div>
                <div class="stack" data-panel="STAFF_TERMS_SERVICE" data-terms-doc="STAFF_TERMS_SERVICE" hidden></div>
                <div class="stack" data-panel="STAFF_PRIVACY" data-terms-doc="STAFF_PRIVACY" hidden></div>
                <div class="stack" data-panel="MARKETING" data-terms-doc="MARKETING" hidden></div>
                <div class="stack" data-panel="LOCATION" data-terms-doc="LOCATION" hidden></div>
              </div>
              </div>
              </div>

            </div>
          </div>
          </div>
        </div>
      </main>
    </div>
    <script src="../assets/app.js"></script>
    <script src="../assets/auth.js"></script>
  </body>
</html>
