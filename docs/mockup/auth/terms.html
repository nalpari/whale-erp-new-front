<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>약관 전문 · WHALE ERP</title>
    <link rel="icon" href="../assets/img/favicon.svg" />
    <link rel="stylesheet" href="../assets/whale.css" />
  </head>
  <body data-root="../" data-page="auth" data-sub="auth/terms.html">
    <!-- 약관 전문 · /terms · 약관 콘텐츠(F-OFBCVL)
         로그인 전 누구나 여는 전문 화면이다. 푸터·가입 화면의 링크가 #use · #privacy · #useStaff · #privacyStaff · #marketing · #location 으로 해당 탭을 열고 들어온다.
         문구는 auth.js 의 TERMS 한 곳에서 오고, 가입 화면의 전문 보기 팝업과 같다.
         받는 대상별로 묶어서 둔다 — 1)·2) BP 사업자 회원가입(BP 회원가입 화면), 3)·4)·5)·6) 직원 근무 앱 회원가입(아직 목업 없음).
         4) 직원 개인정보 수집·이용 동의는 2026-09-30 자체 초안(v0.1)을 처음 채웠다 — 3팀 목업(staff/overview.html 의 주민등록번호·급여계좌 결정)과
         타사 근태관리 SaaS(flex 등) 표준을 참고했고, 아직 3팀·법무 검토 전이라 [ ] 표시가 많다.
         지금 문구는 타사 비교 표준안 초안(docs/raw/2026-09-29-약관3종-표준안.md)이며 법무 검토 전이다. -->
    <a class="skip" href="#main">본문으로 건너뛰기</a>
    <div class="shell">
      <main class="main" id="main">
        <div class="titlebar">
          <h1 class="t-h1">약관 전문</h1>
          <span class="badge badge--warn">1팀 작업</span>
          <div class="titlebar__end">
            <span class="filters__count mono">F-OFBCVL · /terms</span>
          </div>
        </div>

        <div class="content">

          <div class="screen">
            <div class="screen__bar"><i></i><i></i><i></i><span>whale-erp.com/terms</span></div>
          <div class="auth auth--framed" style="grid-template-columns: 1fr">
            <div class="auth__form" style="max-width: 1120px; justify-content: flex-start">
              <div class="inline">
                <a class="brand" href="login.html">
                  <span class="wm brand__mark" data-icon="whale" data-icon-size="32"></span>
                  <span class="brand__name">WHALE <span>ERP</span></span>
                </a>
              </div>

              <div class="demo">
                <b>초안</b>
                <span>1)·2) 는 BP 사업자 회원가입에서, 3)·4)·5)·6) 은 직원 근무 앱 회원가입에서 받습니다. 법무 검토 전 초안이며 [ ] 는 회사가 채울 값입니다.</span>
              </div>

              <div class="tabs" data-tabs="tm">
                <button data-tab="use" aria-selected="true">1) 플랫폼 이용약관(BP사업자 회원가입용) <span class="count">가입</span></button>
                <button data-tab="privacy" aria-selected="false">2) 개인정보 수집·이용 <span class="count">가입</span></button>
                <span aria-hidden="true" style="width: 1px; align-self: stretch; background: var(--hairline-strong); margin: 0 2px"></span>
                <button data-tab="useStaff" aria-selected="false">3) 플랫폼 이용약관(직원앱 회원가입용) <span class="count">직원 앱</span></button>
                <button data-tab="privacyStaff" aria-selected="false">4) 개인정보 수집·이용 <span class="count">직원 앱</span></button>
                <button data-tab="marketing" aria-selected="false">5) 마케팅 수신 <span class="count">직원 앱</span></button>
                <button data-tab="location" aria-selected="false">6) 위치정보 수집·이용 <span class="count">직원 앱</span></button>
              </div>

              <div id="tm">
                <div class="stack" data-panel="use" data-terms-doc="use"></div>
                <div class="stack" data-panel="privacy" data-terms-doc="privacy" hidden></div>
                <div class="stack" data-panel="useStaff" data-terms-doc="useStaff" hidden></div>
                <div class="stack" data-panel="privacyStaff" data-terms-doc="privacyStaff" hidden></div>
                <div class="stack" data-panel="marketing" data-terms-doc="marketing" hidden></div>
                <div class="stack" data-panel="location" data-terms-doc="location" hidden></div>
              </div>

            </div>
          </div>
          </div>
        </div>
      </main>
    </div>
    <script src="../assets/app.js"></script>
    <script src="../assets/auth.js"></script>
  </body>
</html>
